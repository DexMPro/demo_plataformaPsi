<script>
document.addEventListener('DOMContentLoaded', function () {
    var modal = document.getElementById('modal-gasto');
    if (!modal) return;
    var f = modal.querySelector('form');
    document.querySelectorAll('.js-editar-gasto').forEach(function (btn) {
        btn.addEventListener('click', function (ev) {
            ev.preventDefault();
            var d = btn.dataset;
            f.elements['gasto_id'].value = d.id;
            f.elements['fecha'].value = d.fecha;
            f.elements['categoria_id'].value = d.categoria;
            f.elements['proveedor'].value = d.proveedor || '';
            f.elements['numero_comprobante'].value = d.comprobante || '';
            f.elements['descripcion'].value = d.descripcion || '';
            f.elements['total'].value = d.total || '';
            var aviso = modal.querySelector('.notification');
            if (aviso) aviso.remove();
            modal.classList.add('is-active');
        });
    });
});
</script><script src="../demo/mapa.js"></script>
